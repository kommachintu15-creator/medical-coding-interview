
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Coding Freshers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #e5e7eb;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

.tagline {
  color: #667085;
  font-size: 13px;
  margin-top: 5px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 25px 18px;
}

.hero {
  text-align: center;
  padding: 35px 10px;
}

.hero h1 {
  font-size: 30px;
  margin-bottom: 12px;
}

.hero p {
  color: #667085;
  line-height: 1.6;
}

.card {
  background: white;
  padding: 22px;
  margin-bottom: 15px;
  border-radius: 16px;
  border: 1px solid #e5e7eb;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 14px;
  margin-top: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #2563eb;
  color: white;
}

.option {
  background: #f8fafc;
  border: 1px solid #dbe2ea;
  text-align: left;
}

.option:hover {
  background: #eef4ff;
}

.correct {
  background: #dcfce7 !important;
  border: 2px solid #22c55e !important;
}

.wrong {
  background: #fee2e2 !important;
  border: 2px solid #ef4444 !important;
}

.hidden {
  display: none;
}

.progress {
  color: #667085;
  font-size: 14px;
  margin-bottom: 12px;
}

.explanation {
  margin-top: 15px;
  padding: 15px;
  background: #f8fafc;
  border-radius: 10px;
  line-height: 1.5;
}

.score {
  font-size: 30px;
  font-weight: bold;
  text-align: center;
}

.weak {
  background: #fff7ed;
  padding: 18px;
  border-radius: 12px;
  margin-top: 20px;
}

</style>
</head>

<body>

<header>
  <div class="logo">Medical Coding Freshers</div>
  <div class="tagline">
    Learn • Practice • Prepare • Get Interview Ready
  </div>
</header>

<div class="container">

  <section id="home">

    <div class="hero">
      <h1>Medical Coding Assessment</h1>

      <p>
        Practice your knowledge with subject-based
        medical coding assessments.
      </p>
    </div>

    <div class="card">
      <h2>📚 Anatomy</h2>

      <p>
        Choose your difficulty level.
      </p>

      <button class="primary" onclick="startTest()">
        🟢 Anatomy — Easy
      </button>
    </div>

  </section>


  <section id="quiz" class="hidden">

    <div class="progress" id="progress"></div>

    <div class="card">

      <h2 id="question"></h2>

      <div id="options"></div>

      <div id="explanation" class="explanation hidden"></div>

      <button
        id="nextButton"
        class="primary hidden"
        onclick="nextQuestion()">
        Next Question
      </button>

    </div>

  </section>


  <section id="result" class="hidden">

    <div class="card">

      <h2>🎉 Assessment Complete</h2>

      <div class="score" id="score"></div>

      <p id="resultText"></p>

      <div class="weak">
        <h3>🎯 Weak Points</h3>
        <p id="weakPoints"></p>
      </div>

      <button class="primary" onclick="location.reload()">
        Take Again
      </button>

    </div>

  </section>

</div>


<script>

const questions = [

{
question: "How many chambers does the human heart have?",
options: ["2", "3", "4", "5"],
answer: 2,
topic: "Heart",
explanation: "The human heart has four chambers: two atria and two ventricles."
},

{
question: "Which organ pumps blood throughout the body?",
options: ["Lung", "Heart", "Kidney", "Liver"],
answer: 1,
topic: "Heart",
explanation: "The heart pumps blood throughout the body."
},

{
question: "Which organ is mainly responsible for breathing?",
options: ["Liver", "Heart", "Lungs", "Stomach"],
answer: 2,
topic: "Respiratory System",
explanation: "The lungs are the main organs responsible for gas exchange and breathing."
},

{
question: "Which organ stores urine?",
options: ["Kidney", "Bladder", "Ureter", "Urethra"],
answer: 1,
topic: "Urinary System",
explanation: "The urinary bladder temporarily stores urine."
},

{
question: "Which structure carries urine from the kidney to the bladder?",
options: ["Urethra", "Ureter", "Aorta", "Trachea"],
answer: 1,
topic: "Urinary System",
explanation: "The ureter carries urine from each kidney to the urinary bladder."
},

{
question: "Which organ produces bile?",
options: ["Stomach", "Liver", "Pancreas", "Spleen"],
answer: 1,
topic: "Digestive System",
explanation: "The liver produces bile, which helps digest fats."
},

{
question: "Where does most nutrient absorption occur?",
options: ["Stomach", "Small intestine", "Large intestine", "Esophagus"],
answer: 1,
topic: "Digestive System",
explanation: "Most nutrient absorption occurs in the small intestine."
},

{
question: "Which bone protects the brain?",
options: ["Femur", "Skull", "Tibia", "Humerus"],
answer: 1,
topic: "Skeletal System",
explanation: "The skull surrounds and protects the brain."
},

{
question: "What is the largest bone in the human body?",
options: ["Tibia", "Humerus", "Femur", "Radius"],
answer: 2,
topic: "Skeletal System",
explanation: "The femur is the longest and strongest major bone in the human body."
},

{
question: "Which organ is located behind the stomach?",
options: ["Pancreas", "Lung", "Bladder", "Thyroid"],
answer: 0,
topic: "Digestive System",
explanation: "The pancreas is located behind the stomach."
},

{
question: "Which gland is located in the neck?",
options: ["Thyroid", "Adrenal", "Pancreas", "Pituitary"],
answer: 0,
topic: "Endocrine System",
explanation: "The thyroid gland is located in the front of the neck."
},

{
question: "Which organ filters waste from the blood?",
options: ["Heart", "Kidney", "Stomach", "Lung"],
answer: 1,
topic: "Urinary System",
explanation: "The kidneys filter waste and excess substances from the blood."
},

{
question: "What connects muscles to bones?",
options: ["Ligaments", "Tendons", "Cartilage", "Nerves"],
answer: 1,
topic: "Musculoskeletal System",
explanation: "Tendons connect muscles to bones."
},

{
question: "What connects bone to bone?",
options: ["Tendon", "Ligament", "Muscle", "Nerve"],
answer: 1,
topic: "Musculoskeletal System",
explanation: "Ligaments connect bones to other bones."
},

{
question: "Which organ is the largest internal organ?",
options: ["Heart", "Liver", "Kidney", "Lung"],
answer: 1,
topic: "Digestive System",
explanation: "The liver is the largest internal organ in the human body."
}

];


let currentQuestion = 0;
let score = 0;
let answered = false;
let weakTopics = {};


function startTest() {

  document.getElementById("home").classList.add("hidden");

  document.getElementById("quiz").classList.remove("hidden");

  showQuestion();

}


function showQuestion() {

  answered = false;

  const q = questions[currentQuestion];

  document.getElementById("progress").innerText =
    "Question " + (currentQuestion + 1) +
    " of " + questions.length;

  document.getElementById("question").innerText =
    q.question;

  const options = document.getElementById("options");

  options.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.innerText = option;

    button.onclick = function() {

      selectAnswer(index);

    };

    options.appendChild(button);

  });

  document.getElementById("explanation")
    .classList.add("hidden");

  document.getElementById("nextButton")
    .classList.add("hidden");

}


function selectAnswer(selected) {

  if (answered) return;

  answered = true;

  const q = questions[currentQuestion];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach((button, index) => {

    if (index === q.answer) {

      button.classList.add("correct");

    }

    if (index === selected && selected !== q.answer) {

      button.classList.add("wrong");

    }

  });


  if (selected === q.answer) {

    score++;

  } else {

    if (!weakTopics[q.topic]) {

      weakTopics[q.topic] = 0;

    }

    weakTopics[q.topic]++;

  }


  const explanation =
    document.getElementById("explanation");

  explanation.innerHTML =
    "<strong>Explanation:</strong><br>" +
    q.explanation;

  explanation.classList.remove("hidden");

  document.getElementById("nextButton")
    .classList.remove("hidden");

}


function nextQuestion() {

  currentQuestion++;

  if (currentQuestion < questions.length) {

    showQuestion();

  } else {

    showResult();

  }

}


function showResult() {

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.remove("hidden");


  document.getElementById("score").innerText =
    score + " / " + questions.length;


  const percentage =
    Math.round((score / questions.length) * 100);


  document.getElementById("resultText").innerText =
    "You scored " + percentage + "%. Keep practicing!";


  const topics =
    Object.keys(weakTopics);


  if (topics.length === 0) {

    document.getElementById("weakPoints").innerText =
      "Excellent! No weak points identified.";

  } else {

    document.getElementById("weakPoints").innerText =
      topics.join(", ");

  }

}

</script>

</body>
</html>
